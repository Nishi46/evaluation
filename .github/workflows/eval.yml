name: Eval

on:
  pull_request:
    paths:
      - "evalrun/**"
      - "datasets/**"
      - "pyproject.toml"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "evalrun/**"
      - "datasets/**"
      - "pyproject.toml"
      - ".github/workflows/eval.yml"

jobs:
  eval-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -e .

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:11434 >/dev/null && break
            sleep 1
          done

      - name: Pull model
        run: ollama pull llama3.1

      - name: Run eval
        run: evalrun run --dataset datasets/core_regression.yaml --out results/run.jsonl

      - name: Generate report
        run: evalrun report --results results/run.jsonl --format markdown > report_output.txt

      - name: Compare against baseline
        id: compare
        run: |
          set +e
          evalrun compare --current results/run.jsonl --baseline results/baseline.jsonl > compare_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat compare_output.txt

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync("report_output.txt", "utf8");
            const compareOutput = fs.readFileSync("compare_output.txt", "utf8");
            const marker = "<!-- evalrun-report -->";
            const body = `${marker}\n${report}\n\n### Baseline comparison\n\`\`\`\n${compareOutput}\n\`\`\`\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on regression
        if: steps.compare.outputs.exit_code != '0'
        run: exit 1

  update-baseline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -e .

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:11434 >/dev/null && break
            sleep 1
          done

      - name: Pull model
        run: ollama pull llama3.1

      - name: Run eval
        run: evalrun run --dataset datasets/core_regression.yaml --out results/baseline.jsonl

      - name: Commit updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/baseline.jsonl
          if git diff --staged --quiet; then
            echo "no changes to baseline"
          else
            git commit -m "chore: update eval baseline"
            git push
          fi
