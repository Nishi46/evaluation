[project]
name = "evalrun"
version = "0.1.0"
description = "Lightweight LLM eval framework — prompt/agent regression testing"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.26.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
evalrun = "evalrun.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evalrun*"]
